name: Limpiar guía EPG

on:
  schedule:
    # Ejecutar cada 3 horas (a la hora en punto: 0:00, 3:00, 6:00... UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Permite lanzarlo manualmente desde GitHub

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de limpieza
        run: python clean_guide.py guia_limpia.xml

      - name: Commit y push del archivo limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guia_limpia.xml
          git diff --staged --quiet || git commit -m "Guía limpia actualizada automáticamente"
          git push
