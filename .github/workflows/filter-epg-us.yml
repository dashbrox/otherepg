name: Build US filtered EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "filter-epg-us.py"
      - ".github/workflows/epg-us.yml"

concurrency:
  group: filtered-us-epg
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_URL: https://iptv-epg.org/files/epg-us.xml
  OUTPUT_FILE: guides/epg-us-custom.xml.gz
  MAX_CHANNELS: "200"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPTV-EPG US source
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading:"
          echo "$SOURCE_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1200 \
            -A "Mozilla/5.0 GitHub-Actions-EPG/1.0" \
            "$SOURCE_URL" \
            --output epg-us-source.xml

          test -s epg-us-source.xml

          echo "Downloaded file:"
          ls -lh epg-us-source.xml

      - name: Build filtered EPG
        shell: bash
        run: |
          set -euo pipefail

          python3 filter-epg-us.py \
            --source epg-us-source.xml \
            --output "$OUTPUT_FILE" \
            --max-channels "$MAX_CHANNELS"

          test -s "$OUTPUT_FILE"

          echo
          echo "Generated EPG:"
          ls -lh "$OUTPUT_FILE"

      - name: Show EPG report
        shell: bash
        run: |
          echo "======================================"
          echo "FILTERED US EPG REPORT"
          echo "======================================"

          if [ -f epg-us-report.txt ]; then
            cat epg-us-report.txt
          fi

      - name: Commit updated guide
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$OUTPUT_FILE"

          if git diff --cached --quiet; then
            echo "No changes in EPG. Nothing to commit."
            exit 0
          fi

          git commit -m "Update filtered US EPG"
          git push
