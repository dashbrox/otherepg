# Guía tvtv.us (Optimum NY 10080) → XMLTV
# Parte del pipeline de otherepg: publica custom-guides/tvtv-us.xml.gz cada 6 h.
# Los canales presentes en channels_map.csv adoptan su xmltv_id para poder
# fusionarse con las guías de tvpassport / tvtv.ca / tvguide.
#
# URL pública del resultado:
#   https://raw.githubusercontent.com/dashbrox/otherepg/master/custom-guides/tvtv-us.xml.gz

name: Guía tvtv.us (Optimum NY)

on:
  schedule:
    - cron: '23 */6 * * *'   # cada 6 h (minuto 23 para no chocar con el :17 de las otras guías)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-tvtv-us
  cancel-in-progress: true

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # necesario para el rebase del paso de publicación

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tvtv-us/requirements.txt

      - name: Caché del navegador Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tvtv-us/requirements.txt') }}

      - name: Instalar dependencias
        run: |
          pip install -r tvtv-us/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          TVTV_LINEUP_URL: https://www.tvtv.us/ny/new-york/10080/luUSA-NY63086-X
          TVTV_DAYS: '3'
        run: |
          set -euo pipefail
          mkdir -p /tmp/build custom-guides
          python tvtv-us/tvtv_grab.py \
            --lineup-url "$TVTV_LINEUP_URL" \
            --days "$TVTV_DAYS" \
            --map-csv channels_map.csv \
            --out /tmp/build/tvtv-us.xml \
            --gz custom-guides/tvtv-us.xml.gz \
            --debug-dir /tmp/debug-tvtv-us

      - name: Validar gzip
        run: |
          set -euo pipefail
          gzip -t custom-guides/tvtv-us.xml.gz
          ls -lh custom-guides/tvtv-us.xml.gz

      - name: Diagnóstico (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-tvtv-us
          path: /tmp/debug-tvtv-us/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit si hubo cambios
        id: commit_changes
        run: |
          # Nunca publicar una caché de endpoint apuntando al fixture local
          if [ -f tvtv-us/data/endpoint.json ] && grep -q '127\.0\.0\.1' tvtv-us/data/endpoint.json; then
            rm tvtv-us/data/endpoint.json
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in custom-guides/tvtv-us.xml.gz \
                   tvtv-us/data/endpoint.json \
                   tvtv-us/data/channels_cache.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios en la guía tvtv.us."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizar guía tvtv.us [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              if git push origin HEAD:master; then
                echo "Push correcto (intento $intento)"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "No se pudo rebasar (intento $intento)."
            fi
            echo "Reintento en 15 s..."
            sleep 15
          done
          echo "::error::No se pudo publicar la guía tvtv.us tras 3 intentos"
          exit 1
